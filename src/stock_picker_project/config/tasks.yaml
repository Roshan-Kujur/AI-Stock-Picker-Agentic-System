find_trending_companies:
  description: >
     Identify 2–3 companies in the specified sector that demonstrate promising market momentum and 
     positive business developments as of the {current_date} in the {sector}

     1. Review recent financial news, company announcements, and reliable market information to identify 
        potential candidates.
     2. Perform preliminary checks of recent stock price performance, sector-relative performance, and 
        relevant market trends wherever reliable data is available.
     3. Check key indicators of business strength, such as recent earnings announcements, revenue or 
        profit trends, major contracts, business expansion, and other positive growth catalysts, using 
        readily available information.
     4. Screen for significant warning signs, such as sharply deteriorating performance, major negative 
        developments, or speculation-driven price movements. Do not shortlist companies solely because 
        they are frequently mentioned in the news.
     5. Conduct only preliminary, evidence-based screening. Do not perform deep financial statement 
        analysis, detailed valuation, comprehensive risk assessment, or extensive fundamental research, 
        as these are the responsibilities of the Financial Researcher agent.

  expected_output: >
      A list of trending companies in {sector}
  agent: trending_company_finder
  output_file: output/trending_companies_list.json


research_trending_companies:
  description: >
    Given a list of trending companies identified by the previous agent, conduct comprehensive online 
    research on each company and prepare a detailed financial research report. Ensure the research is up 
    to date as of the {current_date}.

    Analyze each company's financial performance, business fundamentals, growth prospects, 
    competitive position, valuation, and major risks. Examine recent financial results, 
    relevant industry trends, and credible market information to assess the company's 
    overall financial health and investment potential.

    Support key findings with reliable sources and distinguish verified facts from estimates or 
    speculation.

  expected_output: >
    A comprehensive research report for each company covering financial health, growth prospects, 
    valuation, competitive position, key risks, and overall investment outlook, supported by credible, 
    up-to-date sources.
  agent: financial_researcher
  context:
    - find_trending_companies
  output_file: output/research_report_trending_companies.json


pick_best_company:
  description: >
    Analyze the research findings and pick the best company for investment. Ensure research is 
    up to date as of {current_date}.
    Send a push notification to the user with the decision and 1 sentence rationale.
    Then respond with a detailed report on why you chose this company, and which companies 
    were not selected.
  expected_output: >
    The chosen company and why it was chosen; the companies that were not selected and why 
    they were not selected.
  agent: stock_picker
  context:
    - research_trending_companies
  output_file: output/decision_on_best_stock.md
